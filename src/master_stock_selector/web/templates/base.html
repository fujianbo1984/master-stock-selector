<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}龙场悟道 · 大师选股{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css?v=20260815-owner-feed-v40">
</head>
<body class="app-body {% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <main class="shell" id="main-content">
    {% block body %}{% endblock %}
  </main>
  <script>
    document.querySelectorAll("[data-password-toggle]").forEach((button) => {
      const input = document.getElementById(button.getAttribute("aria-controls"));
      if (!input) return;
      button.addEventListener("click", () => {
        const reveal = input.type === "password";
        input.type = reveal ? "text" : "password";
        button.textContent = reveal ? "隐藏" : "显示";
        button.setAttribute("aria-pressed", reveal ? "true" : "false");
        input.focus();
      });
    });

    document.querySelectorAll("[data-copy-input]").forEach((button) => {
      button.addEventListener("click", async () => {
        const input = document.getElementById(button.dataset.copyInput);
        const status = button.closest("[role='status']")?.querySelector("[data-copy-status]");
        if (!input || !navigator.clipboard) {
          if (status) status.textContent = "浏览器不支持自动复制，请手动选择 Token。";
          return;
        }
        try {
          await navigator.clipboard.writeText(input.value);
          button.textContent = "已复制";
          if (status) status.textContent = "Token 已复制到剪贴板。";
        } catch (_) {
          input.select();
          if (status) status.textContent = "自动复制被浏览器阻止，已为你选中 Token。";
        }
      });
    });

    document.querySelectorAll("form[data-confirm]").forEach((form) => {
      form.addEventListener("submit", (event) => {
        if (!window.confirm(form.dataset.confirm)) event.preventDefault();
      });
    });

    document.querySelectorAll(".trade-form").forEach((form) => {
      const side = form.querySelector("[data-trade-side]");
      const setupField = form.querySelector("[data-trade-setup-field]");
      const setup = form.querySelector("[data-trade-setup]");
      const exitField = form.querySelector("[data-trade-exit-field]");
      const exitReason = form.querySelector("[data-exit-reason-select]");
      const otherField = form.querySelector("[data-exit-reason-other-field]");
      const other = form.querySelector("[data-exit-reason-other]");
      if (!side || !setupField || !setup || !exitField || !exitReason || !otherField || !other) return;

      const syncTradeFields = () => {
        const selling = side.value === "SELL";
        setupField.hidden = selling;
        setup.disabled = selling;
        exitField.hidden = !selling;
        exitReason.disabled = !selling;
        const showOther = selling && exitReason.value === "OTHER";
        otherField.hidden = !showOther;
        other.disabled = !showOther;
      };

      side.addEventListener("change", syncTradeFields);
      exitReason.addEventListener("change", syncTradeFields);
      syncTradeFields();
    });

    document.querySelectorAll("table[data-sortable='true']").forEach((table) => {
      const headers = Array.from(table.querySelectorAll("thead th"));
      const pageSize = Number(table.dataset.pageSize || 0);
      let currentPage = 0;
      let refreshPagination = () => {};

      if (pageSize > 0) {
        const controls = document.createElement("nav");
        controls.className = "table-pagination";
        controls.setAttribute("aria-label", "观察池分页");
        const previous = document.createElement("button");
        previous.type = "button";
        previous.className = "button button-secondary button-compact";
        previous.textContent = "上一页";
        const status = document.createElement("span");
        status.setAttribute("aria-live", "polite");
        const next = document.createElement("button");
        next.type = "button";
        next.className = "button button-secondary button-compact";
        next.textContent = "下一页";
        controls.append(previous, status, next);
        table.closest(".table-wrap")?.insertAdjacentElement("afterend", controls);

        refreshPagination = () => {
          const rows = Array.from(table.querySelectorAll("tbody tr"));
          const pageCount = Math.max(1, Math.ceil(rows.length / pageSize));
          currentPage = Math.min(currentPage, pageCount - 1);
          rows.forEach((row, index) => {
            row.hidden = index < currentPage * pageSize || index >= (currentPage + 1) * pageSize;
          });
          status.textContent = `第 ${currentPage + 1} / ${pageCount} 页 · 共 ${rows.length} 只`;
          previous.disabled = currentPage === 0;
          next.disabled = currentPage >= pageCount - 1;
        };
        previous.addEventListener("click", () => { currentPage -= 1; refreshPagination(); table.scrollIntoView({ block: "start" }); });
        next.addEventListener("click", () => { currentPage += 1; refreshPagination(); table.scrollIntoView({ block: "start" }); });
      }

      const sortRows = (th, index, direction) => {
        const tbody = table.querySelector("tbody");
        if (!tbody) return;
        const rows = Array.from(tbody.querySelectorAll("tr"));
        table.querySelectorAll("th").forEach(item => { delete item.dataset.direction; item.setAttribute("aria-sort", "none"); });
        th.dataset.direction = direction;
        th.setAttribute("aria-sort", direction === "asc" ? "ascending" : "descending");
        rows.sort((a, b) => {
          const av = a.children[index]?.dataset.sort || a.children[index]?.textContent.trim() || "";
          const bv = b.children[index]?.dataset.sort || b.children[index]?.textContent.trim() || "";
          const an = Number(String(av).replace(/[%亿,]/g, ""));
          const bn = Number(String(bv).replace(/[%亿,]/g, ""));
          const result = Number.isFinite(an) && Number.isFinite(bn)
            ? an - bn
            : String(av).localeCompare(String(bv), "zh-Hans-CN");
          return direction === "asc" ? result : -result;
        });
        rows.forEach(row => tbody.appendChild(row));
        currentPage = 0;
        refreshPagination();
      };

      headers.forEach((th, index) => {
        th.tabIndex = 0;
        th.setAttribute("role", "button");
        th.setAttribute("aria-sort", "none");
        th.setAttribute("aria-label", `按${th.textContent.trim()}排序`);
        const sort = () => {
          const direction = th.dataset.direction === "asc" ? "desc" : "asc";
          sortRows(th, index, direction);
        };
        th.addEventListener("click", sort);
        th.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") { event.preventDefault(); sort(); }
        });
      });

      const defaultIndex = Number(table.dataset.defaultSort);
      if (Number.isInteger(defaultIndex) && headers[defaultIndex]) {
        const defaultDirection = table.dataset.defaultDirection === "asc" ? "asc" : "desc";
        sortRows(headers[defaultIndex], defaultIndex, defaultDirection);
      }
      refreshPagination();
    });

    document.querySelectorAll("[data-daily-tabs]").forEach((tabs) => {
      const tabList = tabs.querySelector("[role='tablist']");
      if (!tabList) return;
      const buttons = Array.from(tabList.querySelectorAll("[role='tab']"));
      const panels = buttons
        .map(button => document.getElementById(button.getAttribute("aria-controls")))
        .filter(Boolean);
      const knownTargets = new Set(panels.map(panel => panel.id));

      const activate = (target, updateHash = false, moveFocus = false) => {
        const selectedTarget = knownTargets.has(target) ? target : panels[0]?.id;
        if (!selectedTarget) return;
        buttons.forEach((button) => {
          const selected = button.getAttribute("aria-controls") === selectedTarget;
          button.setAttribute("aria-selected", selected ? "true" : "false");
          button.tabIndex = selected ? 0 : -1;
          if (selected && moveFocus) button.focus();
        });
        panels.forEach((panel) => { panel.hidden = panel.id !== selectedTarget; });
        if (updateHash) {
          const nextUrl = `${window.location.pathname}${window.location.search}#${selectedTarget}`;
          window.history.replaceState(null, "", nextUrl);
        }
      };

      buttons.forEach((button, index) => {
        button.addEventListener("click", () => {
          activate(button.getAttribute("aria-controls"), true);
        });
        button.addEventListener("keydown", (event) => {
          let nextIndex = null;
          if (event.key === "ArrowRight") nextIndex = (index + 1) % buttons.length;
          if (event.key === "ArrowLeft") nextIndex = (index - 1 + buttons.length) % buttons.length;
          if (event.key === "Home") nextIndex = 0;
          if (event.key === "End") nextIndex = buttons.length - 1;
          if (nextIndex === null) return;
          event.preventDefault();
          activate(buttons[nextIndex].getAttribute("aria-controls"), true, true);
        });
      });

      const hashTarget = window.location.hash.slice(1);
      activate(hashTarget || panels[0]?.id);
      window.addEventListener("hashchange", () => activate(window.location.hash.slice(1)));
    });

    const tradingViewSymbols = (groupId) => {
      const group = document.getElementById(groupId);
      return group
        ? Array.from(group.querySelectorAll("[data-tradingview-symbol]"), link => link.dataset.tradingviewSymbol)
            .filter(Boolean)
        : [];
    };

    document.querySelectorAll("[data-download-tradingview-list]").forEach((button) => {
      button.addEventListener("click", () => {
        const symbols = tradingViewSymbols(button.dataset.downloadTradingviewList);
        if (!symbols.length) { button.textContent = "本组没有可导出的代码"; return; }
        const file = new Blob([symbols.join(",")], { type: "text/plain;charset=utf-8" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(file);
        link.download = "tradingview-watchlist.txt";
        link.click();
        URL.revokeObjectURL(link.href);
      });
    });

    document.querySelectorAll("[data-copy-tradingview-list]").forEach((button) => {
      button.addEventListener("click", async () => {
        const symbols = tradingViewSymbols(button.dataset.copyTradingviewList);
        if (!symbols.length || !navigator.clipboard) { button.textContent = "复制不可用"; return; }
        try {
          await navigator.clipboard.writeText(symbols.join(","));
          button.textContent = `已复制 ${symbols.length} 个代码`;
        } catch (_) {
          button.textContent = "复制被浏览器阻止";
        }
      });
    });

  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
