<aside class="account-settings-sidebar" aria-label="个人设置导航">
  <div class="account-settings-profile">
    <span class="account-settings-avatar" aria-hidden="true">{{ (current_user.display_name or current_user.username)[:1] }}</span>
    <div>
      <span>当前个人工作区</span>
      <strong>{{ current_user.display_name or current_user.username }}</strong>
      <small>@{{ current_user.username }}</small>
    </div>
  </div>
  <nav class="account-settings-nav" aria-label="设置项目">
    <a href="/account/password" {% if request.url.path == '/account/password' %}class="active" aria-current="page"{% endif %}>
      <span>登录与安全</span>
      <small>修改密码与会话保护</small>
    </a>
    <a href="/account/tokens" {% if request.url.path == '/account/tokens' %}class="active" aria-current="page"{% endif %}>
      <span>Agent Token</span>
      <small>授权 CLI 访问个人交易</small>
    </a>
    <a href="/a/reading/trading-system-boundaries" {% if request.url.path == '/a/reading/trading-system-boundaries' %}class="active" aria-current="page"{% endif %}>
      <span>研读随笔</span>
      <small>交易体系与研究边界</small>
    </a>
  </nav>
  <p class="account-settings-boundary">账户凭据只保护个人工作区，不会改变公开方法事实。</p>
</aside>
